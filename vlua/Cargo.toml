[package]
name = "vlua"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
vcore = { path = "../vcore" }
novaforth = { path = "../novaforth" }
tinyjson = "2.5.1"
mlua = { version = "0.12.1", features = ["lua55", "module"] }
